name: Nebula CI

on:
  push:
    branches: [Main, main]
  pull_request:
    branches: [Main, main]

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [interface, orchestration, memory, tools]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: "3.11"
      - name: Install linters
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install black flake8
      - name: Determine service directory
        id: svc
        run: |
          svc_dir=""
          if [ -d "services/${{ matrix.service }}" ]; then
            svc_dir="services/${{ matrix.service }}"
          elif [ -d "src/${{ matrix.service }}" ]; then
            svc_dir="src/${{ matrix.service }}"
          fi
          echo "service_dir=$svc_dir" >> $GITHUB_OUTPUT
      - name: Lint ${{ matrix.service }}
        if: steps.svc.outputs.service_dir != ''
        run: |
          black --check "${{ steps.svc.outputs.service_dir }}" tests/ || true
          flake8 "${{ steps.svc.outputs.service_dir }}" tests/ || true
      - name: Lint repository (fallback)
        if: steps.svc.outputs.service_dir == ''
        run: |
          black --check src/ tests/ || true
          flake8 src/ tests/ || true

  unit-tests:
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      matrix:
        service: [interface, orchestration, memory, tools]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: "3.11"
      - name: Install test deps
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest
      - name: Determine service directory
        id: svc
        run: |
          svc_dir=""
          if [ -d "services/${{ matrix.service }}" ]; then
            svc_dir="services/${{ matrix.service }}"
          elif [ -d "src/${{ matrix.service }}" ]; then
            svc_dir="src/${{ matrix.service }}"
          fi
          echo "service_dir=$svc_dir" >> $GITHUB_OUTPUT
      - name: Run unit tests for ${{ matrix.service }}
        if: steps.svc.outputs.service_dir != ''
        run: |
          if [ -d tests/unit ]; then
            pytest -v tests/unit
          else
            pytest -v
          fi
      - name: Run unit tests (fallback)
        if: steps.svc.outputs.service_dir == ''
        run: |
          if [ -d tests/unit ]; then
            pytest -v tests/unit
          else
            pytest -v
          fi

  integration-tests:
    runs-on: ubuntu-latest
    needs: unit-tests
    strategy:
      matrix:
        service: [interface, orchestration, memory, tools]
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: nebula
          POSTGRES_PASSWORD: nebula
          POSTGRES_DB: nebula_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U nebula" --health-interval=10s --health-timeout=5s --health-retries=5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: "3.11"
      - name: Install test deps
        env:
          DATABASE_URL: postgresql://nebula:nebula@localhost:5432/nebula_test
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest
      - name: Determine service directory
        id: svc
        run: |
          svc_dir=""
          if [ -d "services/${{ matrix.service }}" ]; then
            svc_dir="services/${{ matrix.service }}"
          elif [ -d "src/${{ matrix.service }}" ]; then
            svc_dir="src/${{ matrix.service }}"
          fi
          echo "service_dir=$svc_dir" >> $GITHUB_OUTPUT
      - name: Run integration tests for ${{ matrix.service }}
        if: steps.svc.outputs.service_dir != ''
        env:
          DATABASE_URL: postgresql://nebula:nebula@localhost:5432/nebula_test
        run: |
          if [ -f docker-compose.yml ]; then
            docker compose up -d
          fi
          if [ -d tests/integration ]; then
            pytest -v tests/integration
          else
            pytest -v
          fi
      - name: Run integration tests (fallback)
        if: steps.svc.outputs.service_dir == ''
        env:
          DATABASE_URL: postgresql://nebula:nebula@localhost:5432/nebula_test
        run: |
          if [ -f docker-compose.yml ]; then
            docker compose up -d
          fi
          if [ -d tests/integration ]; then
            pytest -v tests/integration
          else
            pytest -v
          fi
      - name: Build containers (optional)
        run: |
          if [ -f docker-compose.yml ]; then
            docker compose build
          elif [ -f Dockerfile ]; then
            docker build -t nebula-mvp:latest .
          fi
